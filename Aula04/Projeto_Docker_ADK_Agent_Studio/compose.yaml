services:
  exchange-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: skillgo-adk-agent-studio:2.7.1
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      A2A_PUBLIC_URL: http://exchange-agent:8001
    command:
      - uvicorn
      - services.exchange_agent.agent:a2a_app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8091:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8001/.well-known/agent-card.json',
          timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  agent-studio:
    image: skillgo-adk-agent-studio:2.7.1
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      A2A_EXCHANGE_CARD_URL: >-
        http://exchange-agent:8001/.well-known/agent-card.json
    command:
      - adk
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - /app/agents
    depends_on:
      exchange-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./agents:/app/agents:ro
      - ./shared:/app/shared:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
